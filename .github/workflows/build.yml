name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-telegram
  COVERAGE_THRESHOLD: '80'

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: tests with coverage
        run: go test ./... -coverprofile=coverage.out

      # The threshold is checked here rather than trusted to a reviewer's eye: this server
      # holds an authorisation for a personal Telegram account.
      - name: coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          echo "total coverage: ${total}%"
          if [ "$(printf '%s\n' "$total" "$COVERAGE_THRESHOLD" | sort -g | head -1)" != "$COVERAGE_THRESHOLD" ]; then
            echo "coverage ${total}% is below the ${COVERAGE_THRESHOLD}% threshold" >&2
            exit 1
          fi

  image:
    name: Image
    needs: gates
    runs-on: ubuntu-24.04
    # Pull requests from a fork cannot write packages, and an image nobody can push is not
    # worth the minutes.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # One build for both architectures: the Dockerfile cross-compiles, so no emulation is
      # involved and the manifest comes out of a single push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Show what was pushed
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
